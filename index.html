<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <meta name="description" content="TaskFlow is a fast, private task board with a deadline calendar. Your tasks stay in your browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a5bd7'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <!-- Set the theme before first paint so there is no light/dark flash -->
    <script>
        (function () {
            var theme = 'light';
            try {
                var saved = localStorage.getItem('taskflow.theme');
                if (saved === 'light' || saved === 'dark') theme = saved;
                else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <a class="skip-link" href="#board">Skip to the board</a>

    <div class="app">
        <!-- TOP BAR -->
        <header class="topbar">
            <a class="brand" href="./" aria-label="TaskFlow">
                <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="var(--accent)"></rect>
                    <path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span>TaskFlow</span>
            </a>

            <form class="quick-add" id="quickAdd" autocomplete="off">
                <label class="sr-only" for="quickInput">Quick add a task</label>
                <input id="quickInput" type="text" maxlength="200" placeholder="Add a task… try “Send invoice @tomorrow !high”" />
                <button class="btn btn-primary" type="submit">Add</button>
            </form>

            <div class="top-actions">
                <button class="btn" id="newTaskBtn" type="button"><span data-icon="plus"></span> New task</button>
                <button class="icon-btn" id="exportBtn" type="button" aria-label="Export tasks as JSON" title="Export tasks as JSON"><span data-icon="download"></span></button>
                <button class="icon-btn" id="importBtn" type="button" aria-label="Import tasks from JSON" title="Import tasks from JSON"><span data-icon="upload"></span></button>
                <input id="importFile" type="file" accept="application/json,.json" hidden />
                <button class="icon-btn" id="themeBtn" type="button"></button>
            </div>
        </header>

        <div class="layout">
            <!-- BOARD -->
            <main>
                <div class="controls">
                    <div class="search">
                        <span data-icon="search"></span>
                        <input id="searchInput" type="search" placeholder="Search tasks" aria-label="Search tasks (press / to focus)" />
                    </div>
                    <select id="filterStatus" aria-label="Show status">
                        <option value="all">All statuses</option>
                        <option value="todo">To do</option>
                        <option value="doing">In progress</option>
                        <option value="done">Done</option>
                    </select>
                    <select id="filterPriority" aria-label="Show priority">
                        <option value="all">All priorities</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                    <select id="sortBy" aria-label="Sort tasks">
                        <option value="manual">Manual order</option>
                        <option value="due">Due date</option>
                        <option value="priority">Priority</option>
                        <option value="title">Title A–Z</option>
                        <option value="newest">Newest first</option>
                    </select>
                    <button class="chip-btn" id="dateChip" type="button" hidden></button>
                    <button class="btn btn-ghost" id="resetBtn" type="button">Reset filters</button>
                </div>

                <div class="board" id="board" aria-label="Task board"></div>
            </main>

            <!-- SIDE PANELS -->
            <aside class="side">
                <section class="panel" aria-labelledby="summaryTitle">
                    <h2 id="summaryTitle">Progress</h2>
                    <p class="summary-line" id="summaryLine">No tasks yet</p>
                    <div class="progress" id="progressTrack" role="progressbar" aria-labelledby="summaryTitle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <dl class="mini-stats">
                        <div><dt>Overdue</dt><dd id="statOverdue" class="is-danger">0</dd></div>
                        <div><dt>Due today</dt><dd id="statToday">0</dd></div>
                        <div><dt>Done this week</dt><dd id="statWeek">0</dd></div>
                    </dl>
                </section>

                <section class="panel" aria-labelledby="calTitle">
                    <div class="panel-head">
                        <h2 id="calTitle">Calendar</h2>
                        <div class="cal-nav">
                            <button class="icon-btn" id="calPrev" type="button" aria-label="Previous month"><span data-icon="chevron-left"></span></button>
                            <button class="btn btn-sm" id="calToday" type="button">Today</button>
                            <button class="icon-btn" id="calNext" type="button" aria-label="Next month"><span data-icon="chevron-right"></span></button>
                        </div>
                    </div>
                    <p class="cal-month" id="calMonth" aria-live="polite"></p>
                    <div class="cal-grid" id="calGrid"></div>
                    <p class="hint">Select a day to see what is due. Select it again to clear.</p>
                </section>

                <section class="panel" aria-labelledby="upTitle">
                    <h2 id="upTitle">Coming up</h2>
                    <ul class="upcoming" id="upcomingList"></ul>
                </section>
            </aside>
        </div>

        <footer class="footer">
            <span class="shortcut"><kbd>N</kbd> new task</span>
            <span class="shortcut"><kbd>/</kbd> search</span>
            <span class="shortcut"><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Z</kbd> undo</span>
            <span class="shortcut">Your tasks are saved in this browser only. Use export to back them up.</span>
        </footer>
    </div>

    <!-- TASK DIALOG -->
    <dialog id="taskDialog" aria-labelledby="dialogTitle">
        <form id="taskForm" novalidate>
            <h2 id="dialogTitle">New task</h2>

            <div class="field">
                <label for="fTitle">Title</label>
                <input id="fTitle" type="text" maxlength="200" autocomplete="off" required />
            </div>

            <div class="field">
                <label for="fNotes">Notes <span class="optional">(optional)</span></label>
                <textarea id="fNotes" rows="3" maxlength="2000"></textarea>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="fDue">Due date</label>
                    <input id="fDue" type="date" />
                </div>
                <div class="field">
                    <label for="fPriority">Priority</label>
                    <select id="fPriority">
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
            </div>

            <div class="quick-dates" role="group" aria-label="Set due date quickly">
                <button class="btn btn-sm" type="button" data-quick="today">Today</button>
                <button class="btn btn-sm" type="button" data-quick="tomorrow">Tomorrow</button>
                <button class="btn btn-sm" type="button" data-quick="week">In a week</button>
                <button class="btn btn-sm btn-ghost" type="button" data-quick="none">No date</button>
            </div>

            <div class="field">
                <label for="fStatus">Status</label>
                <select id="fStatus">
                    <option value="todo">To do</option>
                    <option value="doing">In progress</option>
                    <option value="done">Done</option>
                </select>
            </div>

            <div class="dialog-actions">
                <button class="btn btn-danger" id="fDelete" type="button" hidden>Delete task</button>
                <span class="spacer"></span>
                <button class="btn" id="fCancel" type="button">Cancel</button>
                <button class="btn btn-primary" id="fSave" type="submit">Add task</button>
            </div>
        </form>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
